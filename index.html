<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Creator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header class="header">
            <div class="icon">×</div>
            <h1>Table <span>Creator</span></h1>
            <p>Create any multiplication table instantly.</p>
        </header>


        <!-- Input Section -->
        <section class="input-card">

            <label for="number">Enter a number</label>

            <div class="input-area">
                <input type="number" id="userNumber" placeholder="e.g. X">

                <button class="create-btn" id="create-btn">
                    Create Table
                </button>

                <button class="clear-btn" id="clear-btn">
                    Clear
                </button>
            </div>

        </section>


        <!-- Result Section -->
        <section class="result-card">

            <div class="result-header">
                <div class="success-icon">✓</div>

                <div>
                    <h2 id="tableHeading">Table of X</h2>
                    <p id="tablePara">Enter a number above to create a table</p>
                </div>
            </div>


            <!-- Sample Table -->
            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>Multiplication</th>
                            <th>Result</th>
                        </tr>
                    </thead>

                    <tbody id="table">

                        <tr>
                            <td>X × 1</td>
                            <td>—</td>
                        </tr>

                        <tr>
                            <td>X × 2</td>
                            <td>—</td>
                        </tr>

                        <tr>
                            <td>X × 3</td>
                            <td>—</td>
                        </tr>

                        <tr>
                            <td>X × 4</td>
                            <td>—</td>
                        </tr>

                        <tr>
                            <td>X × 5</td>
                            <td>—</td>
                        </tr>

                        <tr>
                            <td>X × 6</td>
                            <td>—</td>
                        </tr>

                        <tr>
                            <td>X × 7</td>
                            <td>—</td>
                        </tr>

                        <tr>
                            <td>X × 8</td>
                            <td>—</td>
                        </tr>

                        <tr>
                            <td>X × 9</td>
                            <td>—</td>
                        </tr>

                        <tr>
                            <td>X × 10</td>
                            <td>—</td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>

</body>

</html>
